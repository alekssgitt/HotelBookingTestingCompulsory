name: BuildTestAndStaticAnalysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-static-analysis:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: Install Coverlet
      run: dotnet tool install --global coverlet.console

    - name: Install sonarscanner
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Begin Sonar scan
      run: >
        dotnet sonarscanner begin
        /k:"alekssgitt_HotelBookingTestingCompulsory"
        /o:"alekssgitt"
        /d:sonar.token="$TOKEN"
        /d:sonar.host.url="https://sonarcloud.io"
        /d:sonar.cs.opencover.reportsPaths=coverage.xml

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Debug

    - name: Collect code coverage using Coverlet
      run: >
        coverlet ./HotelBooking.UnitTests/bin/Debug/HotelBooking.UnitTests.dll
        --target "dotnet"
        --targetargs "test HotelBooking.UnitTests/HotelBooking.UnitTests.csproj --no-build --configuration Debug"
        --include "[HotelBooking.Core]*"
        --skipautoprops
        -f=opencover
        -o="coverage.xml"

    - name: Run integration tests
      run: dotnet test HotelBooking.IntegrationTests/HotelBooking.IntegrationTests.csproj --no-build --configuration Debug

    - name: End Sonar scan
      run: dotnet sonarscanner end /d:sonar.token="$TOKEN"
